[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  # The Supabase project URL is public by design (it ships in the browser for the
  # catalog and is just an address, not a credential), so exclude it from Netlify's
  # secret scanner. The real secret — SUPABASE_SERVICE_ROLE — is NOT listed here and
  # stays scanned, so it can never be committed to code.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-store"

# The Product Content Enrichment & Review tool moved to the Connect 360 (main-site) deploy so it
# can use the shared staff sign-in instead of a separate token. Old bookmarks to the copy that
# used to live here are permanently redirected. `force = true` is required because the old file
# still exists at this path — without it Netlify would serve the file instead of redirecting.
[[redirects]]
  from = "/admin/product-content-review.html"
  to = "https://homecareproviderservices.netlify.app/admin/product-content-review.html"
  status = 301
  force = true

[[redirects]]
  from = "/admin/product-content-review"
  to = "https://homecareproviderservices.netlify.app/admin/product-content-review.html"
  status = 301
  force = true

# PHASE 2.8 — CONTAINMENT OF THE OLD PARTNER 360 ADMIN (2026-10-07).
# These pages were the first admin, before Connect 360. Every one has a maintained replacement
# on the main deploy, and several were still able to write catalog, dealer and home-page data
# with a shared passcode and no change history. They are redirected (302 = temporary, while
# usage is reviewed) to the closest current tool. The netlify/functions they called are NOT
# removed here: that waits for the function logs to show nothing legitimate still calls them.
# `force = true` because the old files still exist at these paths.
[[redirects]]
  from = "/admin"
  to = "https://homecareproviderservices.netlify.app/admin/"
  status = 302
  force = true
