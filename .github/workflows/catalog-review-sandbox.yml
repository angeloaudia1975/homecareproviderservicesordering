# Keeps the private CATALOG REVIEW SANDBOX (branch catalog-review → its permanent draft PR's Netlify deploy preview)
# equal to main + every open pull request into main, so the owner reviews all manufacturer work at one address.
# It only pushes the catalog-review branch. It never touches main or any PR branch, never force-pushes, and does
# not deploy production, change Netlify settings or touch the database. See scripts/catalog-review-sync.sh.
name: Catalog review sandbox
on:
  push:
    branches: [main]
  # pull_request_target runs MAIN's copy of this workflow and script (never a PR's), so an unreviewed branch can't change
  # what runs with write access. No PR code is executed: PR heads are only git-merged into the sandbox branch.
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, closed, labeled, unlabeled]
  # A PR joins the sandbox once its checks pass: re-run when a check or a commit status (Netlify) finishes.
  check_suite:
    types: [completed]
  status:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: catalog-review-sandbox
  cancel-in-progress: false
jobs:
  catalog-review-sandbox-sync:
    # The sandbox PR's own pushes do not rebuild it, and PRs from forks are never merged into it.
    # Trigger narrowing (Admin 360 B0, 2026-11-08 — Actions minutes become metered once the repo is private). A job
    # whose `if` is false is skipped without a runner, so it costs no minutes. Skipped, because they can never change
    # the sandbox: a status still "pending" (the finished status arrives as its own event); a status or check suite on
    # the sandbox's OWN branch (its deploy preview used to re-trigger this workflow); one on main (the push event to main
    # already rebuilt it). Every event that can add, update or remove a PR still runs, unchanged.
    if: >-
      (github.event_name != 'pull_request_target' ||
       (github.event.pull_request.head.ref != 'catalog-review' &&
        github.event.pull_request.head.repo.full_name == github.repository)) &&
      (github.event_name != 'status' ||
       (github.event.state != 'pending' &&
        !contains(github.event.branches.*.name, 'catalog-review') &&
        !contains(github.event.branches.*.name, 'main'))) &&
      (github.event_name != 'check_suite' ||
       (github.event.check_suite.head_branch != 'catalog-review' &&
        github.event.check_suite.head_branch != 'main'))
    runs-on: ubuntu-latest
    steps:
      # Always main's script, whatever the event.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true
      - name: Rebuild catalog-review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/catalog-review-sync.sh >> "$GITHUB_STEP_SUMMARY"
