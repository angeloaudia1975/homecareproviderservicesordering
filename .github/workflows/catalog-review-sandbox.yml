# Keeps the private CATALOG REVIEW SANDBOX (branch catalog-review → its permanent draft PR's Netlify deploy preview)
# equal to main + every open pull request into main, so the owner reviews all manufacturer work at one address.
# It only pushes the catalog-review branch. It never touches main or any PR branch, never force-pushes, and does
# not deploy production, change Netlify settings or touch the database. See scripts/catalog-review-sync.sh.
name: Catalog review sandbox
on:
  push:
    branches: [main]
  # pull_request_target runs MAIN's copy of this workflow and script (never a PR's), so an unreviewed branch can't change
  # what runs with write access. No PR code is executed: PR heads are only git-merged into the sandbox branch.
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, closed, labeled, unlabeled]
  # A PR joins the sandbox once its checks pass: re-run when a check or a commit status (Netlify) finishes.
  check_suite:
    types: [completed]
  status:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: catalog-review-sandbox
  cancel-in-progress: false
jobs:
  catalog-review-sandbox-sync:
    # The sandbox PR's own pushes do not rebuild it, and PRs from forks are never merged into it.
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.head.ref != 'catalog-review' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      # Always main's script, whatever the event.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true
      - name: Rebuild catalog-review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/catalog-review-sync.sh >> "$GITHUB_STEP_SUMMARY"
