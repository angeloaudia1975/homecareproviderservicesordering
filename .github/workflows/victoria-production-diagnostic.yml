name: Victoria production diagnostic
on:
  push:
    branches: [codex/victoria-product-search]
    paths: [.github/workflows/victoria-production-diagnostic.yml]
permissions:
  contents: read
jobs:
  compare-public-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Identify the public HTML difference without running page scripts
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const {execFileSync} = require('node:child_process');
          const hash = value => crypto.createHash('sha256').update(value).digest('hex');
          const git = args => execFileSync('git', args, {maxBuffer: 8*1024*1024});
          const baseline = '6028c45fac37e237e0ab0b2981d7e76f144d599a';
          (async () => {
            const res = await fetch('https://hcpsonlineordering.netlify.app/?victoria_diagnostic=' + process.env.GITHUB_SHA, {headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(15000)});
            if (!res.ok || new URL(res.url).origin !== 'https://hcpsonlineordering.netlify.app') throw new Error('Unexpected response ' + res.status);
            const actualBytes = Buffer.from(await res.arrayBuffer());
            if(actualBytes.length > 8*1024*1024) throw new Error('Unexpected response length');
            const expectedBytes = git(['show', baseline+':public/index.html']);
            const actual = actualBytes.toString('utf8'), expected = expectedBytes.toString('utf8');
            let start=0; while(start<Math.min(actual.length,expected.length) && actual[start]===expected[start])start++;
            let tail=0; while(tail<Math.min(actual.length-start,expected.length-start) && actual[actual.length-1-tail]===expected[expected.length-1-tail])tail++;
            console.log(JSON.stringify({status:res.status,contentType:res.headers.get('content-type'),actualLength:actualBytes.length,expectedLength:expectedBytes.length,actualSHA256:hash(actualBytes),expectedSHA256:hash(expectedBytes),commonPrefix:start,commonSuffix:tail}));
            console.log('EXPECTED_FIRST_DIFFERENCE',JSON.stringify(expected.slice(Math.max(0,start-100),start+500)));
            console.log('ACTUAL_FIRST_DIFFERENCE',JSON.stringify(actual.slice(Math.max(0,start-100),start+500)));
            console.log('EXPECTED_LAST_DIFFERENCE',JSON.stringify(expected.slice(Math.max(0,expected.length-tail-400),Math.min(expected.length,expected.length-tail+100))));
            console.log('ACTUAL_LAST_DIFFERENCE',JSON.stringify(actual.slice(Math.max(0,actual.length-tail-400),Math.min(actual.length,actual.length-tail+100))));
            console.log('NORMALIZED_LINE_ENDINGS_MATCH', hash(actual.replace(/\r\n/g,'\n'))===hash(expected.replace(/\r\n/g,'\n')));
            const commits=git(['log','origin/main','-80','--format=%H','--','public/index.html']).toString('utf8').trim().split('\n');
            const matches=[];
            for(const sha of commits){if(!/^[0-9a-f]{40}$/.test(sha))continue;const bytes=git(['show',sha+':public/index.html']);if(hash(bytes)===hash(actualBytes))matches.push(sha);}
            console.log('EXACT_HISTORICAL_MATCHES',JSON.stringify(matches));
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
