<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HCPS — Sales &amp; Commission Analytics</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Arial,sans-serif;background:#eef2f6;color:#10263f}
.wrap{max-width:1120px;margin:0 auto;padding:20px}
.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #ef6a1f;padding-bottom:12px;flex-wrap:wrap;gap:10px}
.top h1{margin:0;font-size:22px}.top .sub{color:#5b7085;font-size:13px;margin-top:3px}
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label.f{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#5b7085}
select,input[type=search]{font:inherit;padding:8px 10px;border:1px solid #cdd8e3;border-radius:8px;background:#fff}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0}
.kpi{background:#fff;border:1px solid #dbe4ec;border-radius:11px;padding:12px 14px}
.kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:#5b7085}
.kpi .v{font-size:22px;font-weight:800;margin-top:4px}.kpi .v.orange{color:#ef6a1f}.kpi .v.blue{color:#1681c2}
.tabs{display:flex;gap:6px;margin:6px 0 14px;flex-wrap:wrap}
.tab{background:#dde6ee;border:0;border-radius:8px 8px 0 0;padding:9px 15px;font-weight:700;font-size:13px;color:#41576b;cursor:pointer}
.tab.on{background:#10263f;color:#fff}
.card{background:#fff;border:1px solid #dbe4ec;border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:#1681c2}
.card h3{margin:14px 0 8px;font-size:13px;color:#10263f}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:6px 8px;border-bottom:1px solid #eef2f6;vertical-align:middle}
th{text-align:left;font-size:10.5px;text-transform:uppercase;color:#5b7085;padding:6px 8px;border-bottom:2px solid #e2e9f0}
.lbl{font-weight:600}.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.num.comm{color:#1c7a44;font-weight:700}.num.dim{color:#8496a8}
.bar{height:14px;background:#1681c2;border-radius:4px;min-width:2px}.bar.rep{background:#ef6a1f}
.barcell{width:34%}
.chip{display:inline-block;background:#eaf3fb;color:#12466e;border:1px solid #cfe2fb;border-radius:20px;padding:1px 9px;font-size:11px;margin:1px 3px 1px 0;white-space:nowrap}
.chip.miss{background:#fff3e0;color:#a5590f;border-color:#f2d9b0;cursor:default}
.dots{display:inline-flex;gap:3px}.dot{width:15px;height:15px;border-radius:3px;background:#e2e9f0;font-size:8px;color:#8496a8;text-align:center;line-height:15px}
.dot.on{background:#1681c2;color:#fff;font-weight:700}
.drow{cursor:pointer}.drow:hover{background:#eef6fd}
.link{color:#1681c2;cursor:pointer;font-weight:600}.link:hover{text-decoration:underline}
.warn{color:#b4651a;font-weight:700}.ok{color:#1c7a44;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcard{border:1px solid #e2e9f0;border-radius:10px;padding:12px 14px}
.mcard .h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.mcard .h .nm{font-weight:800;font-size:14px}.mcard .h .v{font-size:13px;color:#5b7085}
.insight{background:#f2f8ff;border:1px solid #cfe2fb;border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.55}
.insight b{color:#10263f}.insight .tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;margin-right:6px}
.tag.x{background:#fff3e0;color:#a5590f}.tag.r{background:#fdecec;color:#b42323}.tag.g{background:#e9f7ef;color:#1c7a44}
.foot{font-size:11.5px;color:#8496a8;margin-top:6px}
.msg{background:#fff;border:1px solid #dbe4ec;border-radius:12px;padding:22px;text-align:center;color:#5b7085}
.msg.err{background:#fdecec;border-color:#f3c0c0;color:#b42323}
.gate{max-width:360px;margin:60px auto}.gate input{width:100%;margin:10px 0;padding:9px;border:1px solid #cdd8e3;border-radius:8px}
button.go{background:#10263f;color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}
.hint{font-size:12px;color:#5b7085;margin:-4px 0 10px}
.backbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
@media print{.tabs,.ctrls,.backbar button,.top .sub{display:none}}
</style></head>
<body><div class="wrap">
<div class="top">
  <div><h1>HomeCare Provider Services</h1><div class="sub">Sales &amp; Commission Analytics — business development tool</div></div>
  <div class="ctrls">
    <label class="f">Line</label><select id="line" onchange="render()"></select>
    <label class="f">Period</label><select id="period" onchange="render()"></select>
  </div>
</div>
<div id="body"><div class="msg">Loading…</div></div>
<div class="foot" id="foot"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const money=n=>"$"+Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>"$"+Number(n||0).toLocaleString("en-US",{maximumFractionDigits:0});
const pm=p=>{const[y,m]=p.split("-").map(Number);return y*12+(m-1);};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let DATA=null,TOKEN=null,TAB="overview",EXP=null,DEALER=null,LT={},ASSIGN={},REPOPTS=[];
const TABS=[["overview","Overview"],["trend","Line trend"],["dealers","Dealers"],["cadence","Order cadence"],["bizdev","Business development"],["assign","Assignments"]];

async function load(){
  try{
    const h={}; if(TOKEN) h["x-analytics-token"]=TOKEN;
    const r=await fetch("/.netlify/functions/analytics",{headers:h});
    if(r.status===401){gate();return;}
    const j=await r.json(); if(j.error){showErr(j.error);return;}
    DATA=j;
    LT={}; for(const f of j.facts){LT[f.line]=(LT[f.line]||0)+f.sales;}
    ASSIGN={}; (j.assignments||[]).forEach(a=>ASSIGN[a.dealer_name]={rep:a.rep_name||"",acct:a.hcps_account||""});
    REPOPTS=(j.repOptions&&j.repOptions.length?j.repOptions:(j.reps||[])).filter(r=>r&&r!=="Unassigned");
    $("#line").innerHTML=`<option value="all">All lines</option>`+j.lines.map(l=>`<option>${esc(l)}</option>`).join("");
    $("#period").innerHTML=j.periods.map(p=>`<option value="${p.key}">${esc(p.label)}</option>`).join("");
    $("#foot").textContent="Generated "+new Date(j.generatedAt).toLocaleString()+" · cadence in months (source reports are monthly). Product detail shown where the line's report itemizes orders.";
    render();
  }catch(e){showErr(String(e));}
}
function gate(){$("#body").innerHTML=`<div class="gate card"><h2>Enter access code</h2><input id="tok" type="password" placeholder="Analytics passcode" onkeydown="if(event.key==='Enter')submitTok()"><button class="go" onclick="submitTok()">View analytics</button></div>`;}
function submitTok(){TOKEN=$("#tok").value.trim();load();}
function showErr(m){$("#body").innerHTML=`<div class="msg err"><b>Couldn't load analytics.</b><br>${esc(m)}<br><br><button class="go" onclick="load()">Retry</button></div>`;}
function setTab(t){TAB=t;EXP=null;render();}
function openDealer(n){DEALER=n;window.scrollTo(0,0);render();}
function backToList(){DEALER=null;render();}

const months=()=>DATA.periods.filter(p=>p.key!=="all").map(p=>p.key);
const plabel=p=>(DATA.periods.find(x=>x.key===p)||{}).label||p;
const lineF=()=>$("#line").value, periodF=()=>$("#period").value;
function facts(scope={}){const l=scope.line??lineF(),p=scope.period??periodF();return DATA.facts.filter(f=>(l==="all"||f.line===l)&&(p==="all"||f.period===p));}
function gsum(rows,keyFn){const m=new Map();for(const f of rows){const k=keyFn(f);const v=m.get(k)||{sales:0,comm:0,qty:0,recs:0};v.sales+=f.sales;v.comm+=f.comm;v.qty+=f.qty;v.recs+=f.recs;m.set(k,v);}return m;}
function cad(set){const ps=[...set].sort();const n=ps.map(pm);const g=[];for(let i=1;i<n.length;i++)g.push(n[i]-n[i-1]);const avg=g.length?g.reduce((a,b)=>a+b,0)/g.length:null;const since=DATA.latestPeriod?pm(DATA.latestPeriod)-n[n.length-1]:0;return{months:ps,avg,since,count:ps.length};}
function dots(set){return `<span class="dots">`+months().map(p=>`<span class="dot ${set.has(p)?'on':''}" title="${esc(plabel(p))}">${esc(plabel(p).slice(0,1))}</span>`).join("")+`</span>`;}
function barTable(head,items,vk,cls,cells){const mx=Math.max(1,...items.map(i=>i[vk]));return `<table><thead><tr>${head}</tr></thead><tbody>`+items.map(i=>`<tr><td class="lbl">${esc(i.name)}</td><td class="barcell"><div class="bar ${cls}" style="width:${i[vk]/mx*100}%"></div></td>${cells(i)}</tr>`).join("")+`</tbody></table>`;}

function render(){ if(!DATA)return;
  if(DEALER) return renderProfile();
  renderKpis();
  $("#body").innerHTML=`<div id="kpis">${$("#kpis")?$("#kpis").innerHTML:""}</div>`+
    `<div class="tabs">${TABS.map(t=>`<button class="tab ${TAB===t[0]?'on':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join("")}</div><div id="app"></div>`;
  renderKpis();
  ({overview:renderOverview,trend:renderTrend,dealers:renderDealers,cadence:renderCadence,bizdev:renderBizdev,assign:renderAssign}[TAB])();
}
function renderKpis(){
  const rows=facts();const de=new Set(),rp=new Set();let s=0,c=0,recs=0;
  for(const f of rows){s+=f.sales;c+=f.comm;recs+=f.recs;de.add(f.dealer);rp.add(f.rep);}
  const html=`<div class="kpis">
    <div class="kpi"><div class="l">Sales</div><div class="v">${money0(s)}</div></div>
    <div class="kpi"><div class="l">Commission</div><div class="v orange">${money0(c)}</div></div>
    <div class="kpi"><div class="l">Dealers</div><div class="v blue">${de.size}</div></div>
    <div class="kpi"><div class="l">${lineF()==="all"?"Lines":"Reps"}</div><div class="v">${lineF()==="all"?new Set(rows.map(f=>f.line)).size:rp.size}</div></div>
    <div class="kpi"><div class="l">Records</div><div class="v">${recs}</div></div></div>
    <div class="hint">Scope: ${lineF()==="all"?"All lines":esc(lineF())} · ${esc(plabel(periodF()))}</div>`;
  if($("#kpis")) $("#kpis").outerHTML=`<div id="kpis">${html}</div>`;
}
function renderOverview(){const rows=facts();let h="";
  if(lineF()==="all"){const g=[...gsum(rows,f=>f.line)].map(([name,v])=>({name,...v})).sort((a,b)=>b.sales-a.sales);
    h+=`<div class="card"><h2>By line</h2>${barTable(`<th>Line</th><th>Sales</th><th class="num">Sales</th><th class="num">Commission</th><th class="num">Recs</th>`,g,"sales","",i=>`<td class="num">${money0(i.sales)}</td><td class="num comm">${money(i.comm)}</td><td class="num dim">${i.recs}</td>`)}</div>`;}
  const gr=[...gsum(rows,f=>f.rep)].map(([name,v])=>({name,...v})).sort((a,b)=>b.comm-a.comm);
  h+=`<div class="card"><h2>By rep</h2>${barTable(`<th>Rep</th><th>Commission</th><th class="num">Commission</th><th class="num">Sales</th>`,gr,"comm","rep",i=>`<td class="num comm">${money(i.comm)}</td><td class="num dim">${money0(i.sales)}</td>`)}</div>`;
  const gd=[...gsum(rows,f=>f.dealer)].map(([name,v])=>({name,...v})).sort((a,b)=>b.sales-a.sales).slice(0,15);
  h+=`<div class="card"><h2>Top dealers <span class="hint" style="text-transform:none">(full list on the Dealers tab)</span></h2>${barTable(`<th>Dealer</th><th>Sales</th><th class="num">Sales</th><th class="num">Commission</th><th class="num">Recs</th>`,gd,"sales","",i=>`<td class="num">${money0(i.sales)}</td><td class="num comm">${money(i.comm)}</td><td class="num dim">${i.recs}</td>`)}</div>`;
  $("#app").innerHTML=h;
}
function renderTrend(){const l=lineF(),ms=months();const rows=DATA.facts.filter(f=>l==="all"||f.line===l);
  const byM=ms.map(p=>{const fs=rows.filter(f=>f.period===p);return{p,sales:fs.reduce((a,b)=>a+b.sales,0),comm:fs.reduce((a,b)=>a+b.comm,0),recs:fs.reduce((a,b)=>a+b.recs,0),dealers:new Set(fs.map(f=>f.dealer)).size};});
  const mx=Math.max(1,...byM.map(m=>m.sales));
  let h=`<div class="card"><h2>${l==="all"?"All lines":esc(l)} — monthly trend</h2><table><thead><tr><th>Month</th><th>Sales</th><th class="num">Sales</th><th class="num">Commission</th><th class="num">Dealers</th><th class="num">Recs</th></tr></thead><tbody>`+
    byM.map(m=>`<tr><td class="lbl">${esc(plabel(m.p))}</td><td class="barcell"><div class="bar" style="width:${m.sales/mx*100}%"></div></td><td class="num">${money0(m.sales)}</td><td class="num comm">${money(m.comm)}</td><td class="num dim">${m.dealers}</td><td class="num dim">${m.recs}</td></tr>`).join("")+`</tbody></table></div>`;
  if(l==="all"){h+=`<div class="card"><h2>Sales by line &amp; month</h2><table><thead><tr><th>Line</th>${ms.map(p=>`<th class="num">${esc(plabel(p).split(" ")[0])}</th>`).join("")}<th class="num">Total</th></tr></thead><tbody>`;
    const mat=DATA.lines.map(ln=>{const cells=ms.map(p=>DATA.facts.filter(f=>f.line===ln&&f.period===p).reduce((a,b)=>a+b.sales,0));return{ln,cells,tot:cells.reduce((a,b)=>a+b,0)};}).sort((a,b)=>b.tot-a.tot);
    h+=mat.map(r=>`<tr><td class="lbl">${esc(r.ln)}</td>${r.cells.map(c=>`<td class="num ${c?'':'dim'}">${c?money0(c):"·"}</td>`).join("")}<td class="num" style="font-weight:700">${money0(r.tot)}</td></tr>`).join("")+`</tbody></table></div>`;}
  $("#app").innerHTML=h;
}
function dealerAgg(l){const rows=DATA.facts.filter(f=>l==="all"||f.line===l);const m=new Map();
  for(const f of rows){const d=m.get(f.dealer)||{dealer:f.dealer,sales:0,comm:0,recs:0,lines:new Set(),periods:new Set()};d.sales+=f.sales;d.comm+=f.comm;d.recs+=f.recs;d.lines.add(f.line);d.periods.add(f.period);m.set(f.dealer,d);}
  return [...m.values()];}
function renderDealers(){const l=lineF(),q=($("#ds")?.value||"").toLowerCase();
  let ds=dealerAgg(l).sort((a,b)=>b.sales-a.sales); const total=ds.length;
  if(q) ds=ds.filter(d=>d.dealer.toLowerCase().includes(q));
  let h=`<div class="card"><h2>All dealers ${l==="all"?"":"— "+esc(l)} <span class="hint" style="text-transform:none">(${total} total — click any dealer for full profile)</span></h2>
    <input type="search" id="ds" placeholder="Search dealer…" value="${esc(q)}" oninput="render()" style="width:260px;margin-bottom:10px">
    <table><thead><tr><th>Dealer</th><th>Lines</th><th class="num">Sales</th><th class="num">Commission</th><th>Active</th><th></th></tr></thead><tbody>`;
  for(const d of ds){
    h+=`<tr class="drow" onclick="openDealer('${esc(d.dealer).replace(/'/g,"\\'")}')"><td class="lbl">${esc(d.dealer)}</td><td>${[...d.lines].sort().map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</td><td class="num">${money0(d.sales)}</td><td class="num comm">${money(d.comm)}</td><td>${dots(d.periods)}</td><td class="link">View →</td></tr>`;
  }
  h+=`</tbody></table></div>`; $("#app").innerHTML=h;
}
function renderCadence(){const l=lineF();
  const ds=dealerAgg(l).map(d=>({dealer:d.dealer,lines:[...d.lines].sort(),sales:d.sales,...cad(d.periods)})).sort((a,b)=>b.since-a.since||b.sales-a.sales);
  let h=`<div class="card"><h2>Order cadence ${l==="all"?"(all lines)":"— "+esc(l)}</h2><div class="hint">${l==="all"?"Cadence across any line — pick a line to see reorder timing for that line only.":"Reorder cadence for "+esc(l)+"."} “Months since last” ≥ 2 is flagged.</div>
    <table><thead><tr><th>Dealer</th>${l==="all"?"<th>Lines</th>":""}<th>Order months</th><th class="num">Order-months</th><th class="num">Avg gap (mo)</th><th class="num">Since last</th></tr></thead><tbody>`;
  for(const d of ds) h+=`<tr class="drow" onclick="openDealer('${esc(d.dealer).replace(/'/g,"\\'")}')"><td class="lbl link">${esc(d.dealer)}</td>${l==="all"?`<td>${d.lines.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</td>`:""}<td>${dots(new Set(d.months))}</td><td class="num">${d.count}</td><td class="num">${d.avg==null?"—":d.avg.toFixed(1)}</td><td class="num ${d.since>=2?'warn':(d.since===0?'ok':'')}">${d.since}</td></tr>`;
  h+=`</tbody></table></div>`; $("#app").innerHTML=h;
}

function renderProfile(){
  const name=DEALER, fs=DATA.facts.filter(f=>f.dealer===name);
  const linesSet=new Set(fs.map(f=>f.line)); const allLines=DATA.lines;
  let s=0,c=0; const periodsAll=new Set(); for(const f of fs){s+=f.sales;c+=f.comm;periodsAll.add(f.period);}
  const ms=months();
  const monthTot=ms.map(p=>fs.filter(f=>f.period===p).reduce((a,b)=>a+b.sales,0));
  const active=ms.filter((p,i)=>monthTot[i]>0);
  const firstS=monthTot[ms.indexOf(active[0])]||0, lastS=monthTot[ms.indexOf(active[active.length-1])]||0;
  const trendPct=(active.length>=2&&firstS>0)?Math.round((lastS-firstS)/firstS*100):null;
  // per line cards
  const lines=[...linesSet].sort((a,b)=>fs.filter(f=>f.line===b).reduce((x,y)=>x+y.sales,0)-fs.filter(f=>f.line===a).reduce((x,y)=>x+y.sales,0));
  let cards="";
  const lapsing=[];
  for(const L of lines){
    const lf=fs.filter(f=>f.line===L);
    const lsales=lf.reduce((a,b)=>a+b.sales,0), lcomm=lf.reduce((a,b)=>a+b.comm,0);
    const pset=new Set(lf.map(f=>f.period)); const cc=cad(pset);
    if(cc.since>=2) lapsing.push(L);
    const prod=[...gsum(lf.filter(f=>f.product),f=>f.product+"|"+f.productName)].map(([k,v])=>({code:k.split("|")[0],name:k.split("|")[1]||k.split("|")[0],...v})).sort((a,b)=>b.sales-a.sales).slice(0,8);
    const mm=ms.map(p=>lf.filter(f=>f.period===p).reduce((a,b)=>a+b.sales,0));
    const mx=Math.max(1,...mm);
    const trend=`<table style="margin-top:2px"><tbody>`+ms.map((p,i)=>`<tr><td style="padding:2px 6px;font-size:11px;color:#5b7085">${esc(plabel(p).split(" ")[0])}</td><td style="padding:2px 6px"><div class="bar" style="width:${mm[i]/mx*90}%;height:10px;${mm[i]?'':'opacity:.15'}"></div></td><td class="num" style="padding:2px 6px;font-size:11px">${mm[i]?money0(mm[i]):"·"}</td></tr>`).join("")+`</tbody></table>`;
    const prodHtml = prod.length
      ? `<h3>What they order</h3><table><thead><tr><th>Product</th><th class="num">Qty</th><th class="num">Sales</th></tr></thead><tbody>`+prod.map(p=>`<tr><td>${esc(p.name||p.code)}</td><td class="num dim">${p.qty||"—"}</td><td class="num">${money0(p.sales)}</td></tr>`).join("")+`</tbody></table>`
      : `<div class="hint" style="margin-top:8px">This line's report is order-level (no per-product breakdown).</div>`;
    cards+=`<div class="mcard"><div class="h"><div class="nm">${esc(L)}</div><div class="v">${money(lsales)} · comm ${money(lcomm)}</div></div>
      <div style="display:flex;gap:16px;flex-wrap:wrap"><div><div class="hint" style="margin:0">Order months</div>${dots(pset)}</div>
      <div><div class="hint" style="margin:0">Avg gap</div><b>${cc.avg==null?"—":cc.avg.toFixed(1)+" mo"}</b></div>
      <div><div class="hint" style="margin:0">Since last order</div><b class="${cc.since>=2?'warn':'ok'}">${cc.since} mo</b></div></div>
      ${trend}${prodHtml}</div>`;
  }
  const missing=allLines.filter(l=>!linesSet.has(l)).sort((a,b)=>(LT[b]||0)-(LT[a]||0));
  // build a plan
  let plan=`<div class="insight"><b>Business development plan — ${esc(name)}</b><br>`;
  plan+=`<span class="tag ${trendPct==null?'x':(trendPct>=0?'g':'r')}">TREND</span> `;
  plan+= trendPct==null? `Only one active month so far — need more history to trend.`
       : trendPct>=0? `Growing: sales up <b>${trendPct}%</b> from ${esc(plabel(active[0]).split(" ")[0])} to ${esc(plabel(active[active.length-1]).split(" ")[0])}.`
       : `Declining: sales down <b>${Math.abs(trendPct)}%</b> since ${esc(plabel(active[0]).split(" ")[0])} — worth a check-in.`;
  plan+=`<br>`;
  if(missing.length){plan+=`<span class="tag x">CROSS-SELL</span> Buys ${linesSet.size} of ${allLines.length} lines. Not yet buying: ${missing.slice(0,5).map(m=>`<span class="chip miss">${esc(m)}</span>`).join("")} — biggest opportunity: <b>${esc(missing[0])}</b>.<br>`;}
  else plan+=`<span class="tag g">CROSS-SELL</span> Already buys every line — protect &amp; grow.<br>`;
  if(lapsing.length) plan+=`<span class="tag r">RE-ENGAGE</span> Hasn't reordered ${lapsing.map(m=>`<span class="chip">${esc(m)}</span>`).join("")} in 2+ months.`;
  else plan+=`<span class="tag g">ACTIVE</span> Ordering recently across their lines.`;
  plan+=`</div>`;
  $("#body").innerHTML=`
    <div class="backbar"><button class="go" onclick="backToList()">← All dealers</button><button class="go" onclick="window.print()" style="background:#1681c2">Print / PDF</button></div>
    <div class="card"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:baseline">
      <h2 style="font-size:19px;color:#10263f;margin:0;text-transform:none;letter-spacing:0">${esc(name)}</h2>
      <div>${[...linesSet].sort().map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div></div>
      ${(ASSIGN[name]&&(ASSIGN[name].rep||ASSIGN[name].acct))?`<div class="hint" style="margin:6px 0 0">Owner rep: <b>${esc(ASSIGN[name].rep||"—")}</b> · HCPS account #: <b>${esc(ASSIGN[name].acct||"—")}</b></div>`:`<div class="hint" style="margin:6px 0 0">No rep/account assigned yet — set it on the Assignments tab.</div>`}
      <div class="kpis" style="grid-template-columns:repeat(4,1fr);margin:14px 0 4px">
        <div class="kpi"><div class="l">Total sales</div><div class="v">${money0(s)}</div></div>
        <div class="kpi"><div class="l">Commission</div><div class="v orange">${money0(c)}</div></div>
        <div class="kpi"><div class="l">Lines bought</div><div class="v blue">${linesSet.size}/${allLines.length}</div></div>
        <div class="kpi"><div class="l">Active months</div><div class="v">${active.length}/${ms.length}</div></div></div>
    </div>
    ${plan}
    <div class="card"><h2>Per-manufacturer order history, cadence &amp; products</h2><div class="grid2">${cards}</div></div>`;
  window.scrollTo(0,0);
}

function renderBizdev(){
  const ds=dealerAgg("all");
  const allLines=DATA.lines;
  // cross-sell: dealers by spend with their missing lines (weighted to biggest lines)
  const xs=ds.map(d=>{const miss=allLines.filter(l=>!d.lines.has(l)).sort((a,b)=>(LT[b]||0)-(LT[a]||0));return{dealer:d.dealer,sales:d.sales,buys:[...d.lines].sort(),miss};})
    .filter(d=>d.miss.length).sort((a,b)=>b.sales-a.sales).slice(0,25);
  // lapsing: overall since-last >= 2
  const lap=ds.map(d=>({dealer:d.dealer,sales:d.sales,lines:[...d.lines].sort(),...cad(d.periods)})).filter(d=>d.since>=2).sort((a,b)=>b.sales-a.sales);
  // growth/decline Mar vs first active
  const ms=months();
  const gr=ds.map(d=>{const mt=ms.map(p=>DATA.facts.filter(f=>f.dealer===d.dealer&&f.period===p).reduce((a,b)=>a+b.sales,0));const act=mt.map((v,i)=>[v,i]).filter(x=>x[0]>0);if(act.length<2)return null;const f=act[0][0],l=act[act.length-1][0];return{dealer:d.dealer,from:f,to:l,pct:Math.round((l-f)/f*100),delta:l-f};}).filter(Boolean);
  const growth=[...gr].sort((a,b)=>b.delta-a.delta).slice(0,8);
  const decline=[...gr].sort((a,b)=>a.delta-b.delta).slice(0,8);
  let h=`<div class="card"><h2>Cross-sell opportunities <span class="hint" style="text-transform:none">(biggest dealers not yet buying every line)</span></h2>
    <table><thead><tr><th>Dealer</th><th class="num">Total spend</th><th>Buys</th><th>Opportunity (not buying)</th></tr></thead><tbody>`+
    xs.map(d=>`<tr class="drow" onclick="openDealer('${esc(d.dealer).replace(/'/g,"\\'")}')"><td class="lbl link">${esc(d.dealer)}</td><td class="num">${money0(d.sales)}</td><td>${d.buys.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</td><td>${d.miss.slice(0,4).map(x=>`<span class="chip miss">${esc(x)}</span>`).join("")}</td></tr>`).join("")+`</tbody></table></div>`;
  h+=`<div class="card"><h2>Re-engage — dealers who've gone quiet <span class="hint" style="text-transform:none">(no order in 2+ months)</span></h2>`;
  h+= lap.length? `<table><thead><tr><th>Dealer</th><th class="num">Historical sales</th><th>Lines</th><th>Last order</th></tr></thead><tbody>`+
    lap.map(d=>`<tr class="drow" onclick="openDealer('${esc(d.dealer).replace(/'/g,"\\'")}')"><td class="lbl link">${esc(d.dealer)}</td><td class="num">${money0(d.sales)}</td><td>${d.lines.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</td><td class="warn">${esc(plabel(d.months[d.months.length-1]))} (${d.since} mo ago)</td></tr>`).join("")+`</tbody></table>`
    : `<div class="hint">No lapsed dealers — everyone ordered recently.</div>`;
  h+=`</div>`;
  h+=`<div class="grid2">
    <div class="card"><h2 class="ok">Fastest growing</h2><table><thead><tr><th>Dealer</th><th class="num">From→To</th><th class="num">Change</th></tr></thead><tbody>`+
      growth.map(d=>`<tr class="drow" onclick="openDealer('${esc(d.dealer).replace(/'/g,"\\'")}')"><td class="lbl link">${esc(d.dealer)}</td><td class="num dim">${money0(d.from)}→${money0(d.to)}</td><td class="num ok">+${money0(d.delta)}</td></tr>`).join("")+`</tbody></table></div>
    <div class="card"><h2 class="warn">Declining</h2><table><thead><tr><th>Dealer</th><th class="num">From→To</th><th class="num">Change</th></tr></thead><tbody>`+
      decline.map(d=>`<tr class="drow" onclick="openDealer('${esc(d.dealer).replace(/'/g,"\\'")}')"><td class="lbl link">${esc(d.dealer)}</td><td class="num dim">${money0(d.from)}→${money0(d.to)}</td><td class="num warn">${money0(d.delta)}</td></tr>`).join("")+`</tbody></table></div></div>`;
  $("#app").innerHTML=h;
}
function renderAssign(){
  const q=($("#as")?.value||"").toLowerCase();
  let ds=dealerAgg("all").sort((a,b)=>b.sales-a.sales);
  if(q) ds=ds.filter(d=>d.dealer.toLowerCase().includes(q));
  const datalist=`<datalist id="repopts">${REPOPTS.map(r=>`<option value="${esc(r)}">`).join("")}</datalist>`;
  let h=`<div class="card"><h2>Assign rep &amp; HCPS account <span class="hint" style="text-transform:none">— saves live to the database</span></h2>
    <div class="hint">Set each dealer's owning rep and HCPS account number. This is the dealer's assignment for territory/logins; it does not rewrite the commission already reported by each manufacturer.</div>
    <input type="search" id="as" placeholder="Search dealer…" value="${esc(q)}" oninput="render()" style="width:260px;margin-bottom:10px">${datalist}
    <table><thead><tr><th>Dealer</th><th>Reported rep(s)</th><th>Assigned rep (owner)</th><th>HCPS account #</th><th></th></tr></thead><tbody>`;
  ds.forEach((d,i)=>{
    const rr=[...new Set(DATA.facts.filter(f=>f.dealer===d.dealer).map(f=>f.rep))].sort().join(", ");
    const a=ASSIGN[d.dealer]||{rep:"",acct:""};
    h+=`<tr><td class="lbl">${esc(d.dealer)}</td><td class="dim" style="font-size:12px">${esc(rr)}</td>
      <td><input list="repopts" id="rep_${i}" value="${esc(a.rep)}" placeholder="rep…" style="width:150px"></td>
      <td><input id="acct_${i}" value="${esc(a.acct)}" placeholder="account #" style="width:130px"></td>
      <td><button class="go" style="padding:6px 12px" onclick="saveAssign('${esc(d.dealer).replace(/'/g,"\\'")}',${i},this)">Save</button> <span id="st_${i}" class="hint" style="margin:0"></span></td></tr>`;
  });
  h+=`</tbody></table></div>`; $("#app").innerHTML=h;
}
async function saveAssign(name,i){
  const rep=$("#rep_"+i).value.trim(), acct=$("#acct_"+i).value.trim(), st=$("#st_"+i);
  st.textContent="Saving…"; st.className="hint"; st.style.margin="0";
  try{
    const h={"content-type":"application/json"}; if(TOKEN)h["x-analytics-token"]=TOKEN;
    const r=await fetch("/.netlify/functions/assign",{method:"POST",headers:h,body:JSON.stringify({dealer_name:name,rep_name:rep,hcps_account:acct})});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.ok){ASSIGN[name]={rep,acct};st.textContent="Saved ✓";st.className="ok";}
    else {st.textContent="Error: "+(j.error||r.status);st.className="warn";}
  }catch(e){st.textContent="Error";st.className="warn";}
}
load();
</script></body></html>
