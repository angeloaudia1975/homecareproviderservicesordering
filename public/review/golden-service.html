<title>Design review · Golden Service &amp; Support (sample data)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1f33;--orange:#ef6325;--ink:#152332;--muted:#6b7d90;--border:#e0e6ee;--paper:#eef1f5}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--paper);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);overflow-x:hidden}
.rv-band{background:#7a1f00;color:#fff;font-weight:800;font-size:13px;padding:8px 16px;text-align:center;letter-spacing:.2px}
.rv-top{background:var(--navy);color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.rv-top b{font-family:Archivo,Inter,sans-serif;font-size:16px}.rv-top span{color:#9fb0c4;font-size:12.5px}
.rv-wrap{max-width:1240px;margin:0 auto;padding:16px}
.rv-ph{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;margin:6px 0 14px}
.rv-ph h1{font-family:Archivo,Inter,sans-serif;font-size:26px;margin:0 0 4px;color:#12253c}.rv-ph .sub{color:var(--muted);font-size:14px;max-width:760px}
.rv-tog{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff}
.rv-tog button{border:0;background:#fff;color:#41546a;font:700 13.5px Inter,sans-serif;padding:0 14px;min-height:44px;cursor:pointer}
.rv-tog button[aria-pressed="true"]{background:var(--navy);color:#fff}
.rv-note{background:#fff7ef;border:1px solid #f6c9a8;border-left:4px solid var(--orange);border-radius:12px;padding:10px 14px;font-size:13.5px;color:#41546a;margin-bottom:14px}
.rv-off{background:#fff;border:1px solid var(--border);border-radius:14px;padding:24px;max-width:640px;margin:40px auto;text-align:center}
</style></head>
